name: CI/CD

on:
  push:
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint:strict
      - run: npm run verify:trips

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build


  e2e:
    name: UI and layout checks
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Playwright is CI-only until the approved screenshot baselines are committed.
      - run: npm install --no-save --package-lock=false @playwright/test@1.55.1
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - name: Save reviewed visual baselines once
        if: github.event_name == 'push' && github.ref_name == 'feat/japan-trip-migration'
        shell: bash
        run: |
          set -euo pipefail
          if [ -d tests/e2e/visual-baselines ]; then
            echo "Approved baselines already exist; no automatic updates."
            exit 0
          fi
          mkdir -p tests/e2e/visual-baselines
          for name in desktop-itinerary desktop-checklist desktop-reference desktop-map mobile-itinerary mobile-checklist mobile-map; do
            source_file="$(find test-results -name "$name.png" -type f -print -quit)"
            test -n "$source_file"
            cp "$source_file" "tests/e2e/visual-baselines/$name.png"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/visual-baselines
          git commit -m "test(trips): approve desktop and mobile golden screenshots"
          git push origin HEAD:refs/heads/feat/japan-trip-migration
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: japan-trip-browser-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
