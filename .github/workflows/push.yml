name: CI/CD

on:
  push:
  pull_request:

jobs:
  update-playwright-lock:
    name: One-time Playwright lockfile update
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/japan-trip-migration'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --package-lock-only --save-dev --save-exact @playwright/test@1.55.1
      - name: Commit npm-generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "build(trips): pin Playwright and update npm lockfile"
            git push origin HEAD:refs/heads/feat/japan-trip-migration
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint:strict
      - run: npm run verify:trips

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build


  e2e:
    name: UI and layout checks
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false @playwright/test@1.55.1
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
