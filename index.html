<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Huixin Yang — Platform & Backend Engineering</title>
    <meta name="description" content="Platform and backend engineering portfolio focused on AWS infrastructure, Pulumi IaC, CI/CD automation, platform governance and production reliability." />
    <link rel="icon" type="image/png" sizes="48x48" href="/portfolio-rocket-v2-48.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/portfolio-rocket-v2-192.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#faf9f7" />
    <meta name="apple-mobile-web-app-title" content="Huixin Yang" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <script>
      (() => {
        const storageKey = "theme";
        const light = "light";
        const dracula = "dracula";

        try {
          const storedTheme = localStorage.getItem(storageKey);
          const theme =
            storedTheme === light || storedTheme === dracula
              ? storedTheme
              : window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
              ? dracula
              : light;

          document.documentElement.classList.toggle("dark", theme === dracula);
          document.documentElement.style.colorScheme = theme === dracula ? "dark" : "light";
          document.documentElement.dataset.theme = theme;
        } catch {
          document.documentElement.classList.remove("dark");
          document.documentElement.style.colorScheme = "light";
          document.documentElement.dataset.theme = light;
        }
      })();
    </script>
  </head>
  <body>
    <noscript>
      Huixin Yang — platform and backend engineering, with experience in AWS cloud
      infrastructure, Infrastructure as Code, CI/CD automation, Snowflake/dbt
      data platforms, and reliable software delivery. View engineering case studies
      and independent software projects by enabling JavaScript.
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
